name: Porter / tooling bug
description: Something in tools/omarchy-to-hudu misbehaves
title: "[porter] <what happened>"
labels: ["bug", "tooling"]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      placeholder: python3 tools/omarchy-to-hudu/port_theme.py --dark foo --name foo
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error
      render: shell
    validations:
      required: true
  - type: input
    id: palette-source
    attributes:
      label: Palette source
      description: Which omarchy theme or registry entry you were porting
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`python3 tools/omarchy-to-hudu/check_roundtrip.py` prints PASS on a clean checkout"
        - label: Python is 3.11+ (`python3 --version`)
